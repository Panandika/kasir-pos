# Builds the register snapshot used by cloud import ("Daftarkan dari cloud").
#
# There is no in-store hub running the snapshot worker, so GitHub builds it:
#   - schedule (every 10 min): if the dashboard queued a build ("Bangun snapshot
#     sekarang" -> snapshot_build_requests 'pending'), claim it, build, upload,
#     record snapshot_metadata and mark the request completed/failed. Exits in
#     seconds when nothing is queued (no .NET setup).
#   - workflow_dispatch: build + publish now (fulfils any queued requests too).
#
# The build itself is `Kasir.CloudSync --build-snapshot` (Program.cs ->
# Snapshot/SnapshotPublisher.cs): reads the cloud mirror, writes a single-file
# SQLite snapshot, Brotli-compresses it (~189 MB -> ~37 MB, under the 50 MB
# free-plan Storage limit), uploads it to Storage bucket "snapshots" as
# snapshot-{uuid}.db.br and inserts snapshot_metadata (storage_path
# "snapshots/snapshot-{uuid}.db.br"; sha256/size_bytes = the compressed object),
# superseding older rows. snapshot-download reports "encoding":"br" and the POS
# restorer decompresses after verifying the download.
#
# Required GH secrets:
#   SUPABASE_CONN_STRING      — Postgres URI, postgresql://user:pass@host:port/postgres
#                               (URI form: also read by psql in the queue check)
#   SUPABASE_URL              — https://<project>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY — service key (Storage upload)
# Optional repo variable:
#   SNAPSHOT_MAX_UPLOAD_MB    — Storage per-file limit (default 50 = free plan)
#
# Note: scheduled workflows are paused by GitHub after 60 days without repo
# activity; re-enable from the Actions tab if that happens.
#
# Plan: ../../../.omc/plans/cloud-import-pairing.md §6
# PRD story: US-P4-1
name: snapshot-fallback

on:
  workflow_dispatch:
    inputs:
      register_id:
        description: "Register being commissioned (logged only; build is identical regardless)"
        required: false
        default: "n/a"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: snapshot-build
  cancel-in-progress: false

jobs:
  build:
    name: Build + publish snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_CONN_STRING: ${{ secrets.SUPABASE_CONN_STRING }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MAX_UPLOAD_MB: ${{ vars.SNAPSHOT_MAX_UPLOAD_MB || '50' }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          missing=""
          [ -z "$SUPABASE_CONN_STRING" ] && missing="$missing SUPABASE_CONN_STRING"
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::warning::snapshot-fallback not configured (missing secrets:$missing); skipping"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::missing secrets:$missing"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Cheap poll so the 10-minute schedule doesn't set up .NET for nothing.
      - name: Check queued build requests
        id: queue
        if: steps.cfg.outputs.ready == 'true'
        env:
          PGSSLMODE: require
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          PENDING=$(psql "$SUPABASE_CONN_STRING" -tAc \
            "select count(*) from public.snapshot_build_requests where status = 'pending'
               or (status = 'in_progress' and started_at < now() - interval '30 minutes')")
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          echo "queued build requests: $PENDING"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$PENDING" = "0" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.queue.outputs.run == 'true'

      - name: Setup .NET 10
        if: steps.queue.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build CloudSync
        if: steps.queue.outputs.run == 'true'
        run: dotnet build Kasir.CloudSync --configuration Release

      - name: Build + publish snapshot
        if: steps.queue.outputs.run == 'true'
        run: |
          mkdir -p ./out
          if [ "${{ steps.queue.outputs.pending }}" != "0" ]; then
            MODE="--process-pending"
          else
            MODE="--upload --trigger gha_fallback"
          fi
          echo "mode: $MODE (register ${{ inputs.register_id || 'n/a' }})"
          dotnet run --project Kasir.CloudSync --configuration Release --no-build -- \
            --build-snapshot $MODE \
            --max-upload-mb "$MAX_UPLOAD_MB" \
            --output ./out/snapshot.db

      # No artifact upload of the snapshot: this repo is public and the file
      # holds the store's full product/supplier/price data.
