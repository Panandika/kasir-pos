name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v2.2.1)'
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        register: ['01', '02', '03']

    steps:
    - uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      shell: pwsh
      run: |
        $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.event.release.tag_name }}" }
        $ver = $tag -replace '^v', ''
        echo "TAG=$tag" >> $env:GITHUB_OUTPUT
        echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Build
      run: dotnet build Kasir.Avalonia.slnx -c Release -p:Version=${{ steps.version.outputs.VERSION }} -p:InformationalVersion=${{ steps.version.outputs.VERSION }}

    - name: Test
      if: matrix.register == '01'
      run: dotnet test Kasir.Core.Tests/Kasir.Core.Tests.csproj -c Release --no-build

    - name: Publish win-x64 self-contained
      # Version from the tag, so the app's footer / About / update check report exactly
      # the release version (AppVersion.Current reads InformationalVersion).
      run: dotnet publish Kasir.Avalonia/Kasir.Avalonia.csproj -c Release -r win-x64 --self-contained -p:Version=${{ steps.version.outputs.VERSION }} -p:InformationalVersion=${{ steps.version.outputs.VERSION }} -o publish/win-x64-${{ matrix.register }}

    - name: Write help.json (public config only)
      shell: pwsh
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        # Optional: shown on the cloud-import screen ("Buka dashboard toko di ...").
        DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      run: |
        $releaseDir = "publish/win-x64-${{ matrix.register }}"
        # This repo and its releases are PUBLIC: help.json must carry only public
        # values (server URL, anon key, store/register ids). The register's Bantuan
        # machine login (email + password) is NOT shipped here anymore; it is issued
        # by the register-pair Edge Function during "Daftarkan dari cloud" and stored
        # encrypted on the PC (Kasir.Core/Help/Auth/MachineCredentialStore.cs).
        $helpConfig = [ordered]@{
          SupabaseUrl = $env:SUPABASE_URL
          AnonKey     = $env:SUPABASE_ANON_KEY
          StoreId     = "sinar-makmur"
          RegisterId  = "${{ matrix.register }}"
        }
        if (-not [string]::IsNullOrEmpty($env:DASHBOARD_URL)) { $helpConfig.DashboardUrl = $env:DASHBOARD_URL }
        $json = $helpConfig | ConvertTo-Json -Depth 3
        [System.IO.File]::WriteAllText("$releaseDir/help.json", $json, [System.Text.Encoding]::UTF8)
        Write-Host "help.json written for register ${{ matrix.register }} (public fields only)"

    - name: Prepare release directory
      shell: pwsh
      run: |
        $releaseDir = "publish/win-x64-${{ matrix.register }}"
        "${{ steps.version.outputs.VERSION }}" | Set-Content "$releaseDir/version.txt" -NoNewline

    - name: Generate checksums
      shell: pwsh
      run: |
        $releaseDir = "publish/win-x64-${{ matrix.register }}"
        $checksumLines = @()

        Get-ChildItem $releaseDir -Recurse -File |
          Where-Object { $_.Name -ne "checksum.sha256" -and $_.Name -ne "checksum.sha256.sig" } |
          ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $relativePath = $_.FullName.Substring((Resolve-Path $releaseDir).Path.Length + 1).Replace("\", "/")
            $checksumLines += "$hash  $relativePath"
          }

        $checksumContent = $checksumLines -join "`n"
        # UTF-8 without BOM: the signature covers these exact bytes.
        [System.IO.File]::WriteAllText("$releaseDir/checksum.sha256", $checksumContent, (New-Object System.Text.UTF8Encoding($false)))
        Write-Host "Generated checksums for $($checksumLines.Count) files"

    - name: Sign checksums (ECDSA P-256)
      shell: pwsh
      env:
        UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      run: |
        # The POS installs an update only if checksum.sha256 carries a valid signature
        # from this key (public half embedded in Kasir.Core/Services/UpdateSignature.cs).
        # No key = no release: unsigned packages would be refused by every register.
        if ([string]::IsNullOrEmpty($env:UPDATE_SIGNING_KEY)) {
          Write-Error "UPDATE_SIGNING_KEY secret is not set; refusing to publish an unsigned release."
          exit 1
        }
        $releaseDir = "publish/win-x64-${{ matrix.register }}"
        $bytes = [System.IO.File]::ReadAllBytes("$releaseDir/checksum.sha256")
        $ecdsa = [System.Security.Cryptography.ECDsa]::Create()
        try {
          $ecdsa.ImportFromPem($env:UPDATE_SIGNING_KEY)
          # IEEE P1363 (r||s) — the .NET default, matched by ECDsa.VerifyData in the POS.
          $sig = $ecdsa.SignData($bytes, [System.Security.Cryptography.HashAlgorithmName]::SHA256)
        } finally {
          $ecdsa.Dispose()
        }
        [System.IO.File]::WriteAllText("$releaseDir/checksum.sha256.sig", [Convert]::ToBase64String($sig))
        Write-Host "checksum.sha256 signed ($($bytes.Length) bytes)"

    - name: Create release ZIP
      shell: pwsh
      run: |
        Push-Location "publish/win-x64-${{ matrix.register }}"
        Compress-Archive -Path "*" -DestinationPath "../../kasir-${{ steps.version.outputs.VERSION }}-register-${{ matrix.register }}.zip"
        Pop-Location

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.TAG }}
        files: |
          kasir-${{ steps.version.outputs.VERSION }}-register-${{ matrix.register }}.zip
        generate_release_notes: false
        # Keep release-please's changelog (shown by the POS update screen) and append
        # the install instructions below it.
        append_body: true
        body: |

          ---

          ## Cara Install (Windows)

          **PENTING:** ada 3 file ZIP berbeda. Setiap register harus pakai file yang sesuai nomornya.

          | Register | File |
          |----------|------|
          | Register 01 | `kasir-${{ steps.version.outputs.VERSION }}-register-01.zip` |
          | Register 02 | `kasir-${{ steps.version.outputs.VERSION }}-register-02.zip` |
          | Register 03 | `kasir-${{ steps.version.outputs.VERSION }}-register-03.zip` |

          1. Download file ZIP sesuai nomor register
          2. Klik kanan → **Extract All** → pilih folder tujuan (misal: `C:\Kasir`)
          3. Buka folder hasil ekstrak → double-click **`Kasir.Avalonia.exe`**
          4. Tidak perlu install .NET atau software tambahan

          > **Upgrade dari versi lama?**
          > Mulai v2.8.1: buka **Utility → Periksa Update** di POS (F5 periksa, F8 pasang). Update diunduh dari GitHub, diperiksa tanda tangannya, lalu dipasang otomatis.
          > Versi 2.8.0 atau lebih lama: ekstrak ZIP ini ke folder yang sama sekali saja, timpa file lama. Data (`kasir.db`) tidak akan tertimpa.

          > **Salah download nomor register?**
          > Fitur Bantuan akan terdaftar dengan ID register yang salah. Hapus folder, download ulang yang benar.

          ---

          ## Installation (English)

          **IMPORTANT:** there are 3 different ZIP files. Each register MUST use the file matching its number.

          | Register | File |
          |----------|------|
          | Register 01 | `kasir-${{ steps.version.outputs.VERSION }}-register-01.zip` |
          | Register 02 | `kasir-${{ steps.version.outputs.VERSION }}-register-02.zip` |
          | Register 03 | `kasir-${{ steps.version.outputs.VERSION }}-register-03.zip` |

          1. Download the ZIP matching your register number
          2. Right-click → **Extract All** → choose a destination folder (e.g. `C:\Kasir`)
          3. Open the extracted folder → double-click **`Kasir.Avalonia.exe`**
          4. No .NET runtime or additional software required — everything is bundled

          > **Upgrading from an older version?**
          > From v2.8.1: in the POS open **Utility → Periksa Update** (F5 check, F8 install). The update is downloaded from GitHub, its signature verified, and installed automatically.
          > 2.8.0 or older: extract this ZIP into the same folder once, overwriting existing files. Your database (`kasir.db`) will not be affected.

          > **Downloaded the wrong register number?**
          > The Bantuan help feature will register tickets under the wrong register ID. Delete the folder and re-download the correct one.
